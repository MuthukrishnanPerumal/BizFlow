<mat-form-field appearance="outline">
  <mat-label>{{ label() }}</mat-label>
  <input matInput [formControl]="query" [matAutocomplete]="auto" (blur)="blur()" />
  <mat-autocomplete #auto="matAutocomplete">
    @for (option of options(); track option.id) {
      <mat-option [value]="option.name + ' (' + option.code + ')'" (onSelectionChange)="choose($event, option)">
        {{ option.name }} ({{ option.code }})
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
@if (!selected() && options().length === 0 && query.value.trim().length > 0) {
  <p class="hint">No active matches.</p>
}
