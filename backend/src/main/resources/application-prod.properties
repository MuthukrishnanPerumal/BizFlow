spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.pool-name=bizflow
# Default pool sized for free-tier MySQL connection limits; raise on paid plans.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.leak-detection-threshold=30000

app.security.jwt.secret=${JWT_SECRET}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:20}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Free-tier hosts: surface slow requests earlier in Render logs.
app.performance.slow-request-ms=${SLOW_REQUEST_MS:800}
app.performance.slow-query-ms=${SLOW_QUERY_MS:200}
app.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
