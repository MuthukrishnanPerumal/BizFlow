spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/aveline_bizflow_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.pool-name=bizflow-test
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

app.security.jwt.secret=${JWT_SECRET:test-only-change-me-use-32-characters-min}
app.security.login.max-attempts=100000
app.cors.allowed-origins=http://localhost:4200
