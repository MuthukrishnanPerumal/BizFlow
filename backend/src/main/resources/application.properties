spring.application.name=aveline-bizflow
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mvc.problemdetails.enabled=false
spring.lifecycle.timeout-per-shutdown-phase=20s

# Prefer PORT (Render and many PaaS hosts), then SERVER_PORT, then 8080.
server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=false
management.info.build.enabled=true

server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.aveline.bizflow
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false

app.security.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT8H}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:30}
app.security.login.window=${LOGIN_WINDOW:PT1M}
app.security.revoked-token-cleanup-ms=${REVOKED_TOKEN_CLEANUP_MS:3600000}
app.api-docs.enabled=${API_DOCS_ENABLED:true}

# Request/query latency thresholds for structured logs (no secrets, no payloads).
app.performance.slow-request-ms=${SLOW_REQUEST_MS:1000}
app.performance.slow-query-ms=${SLOW_QUERY_MS:250}
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=${SLOW_QUERY_MS:250}
