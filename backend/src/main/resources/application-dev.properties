spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/aveline_bizflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.pool-name=bizflow-dev
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

spring.jpa.properties.hibernate.format_sql=true

app.security.jwt.secret=${JWT_SECRET:dev-only-change-me-use-32-characters-min}
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
