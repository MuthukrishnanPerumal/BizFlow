# Render Blueprint (optional). Secrets must be set in the Render dashboard,
# not committed here. Create the service from the dashboard if you prefer.
services:
  - type: web
    name: aveline-bizflow-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: API_DOCS_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: JWT_ACCESS_TTL
        value: PT8H
      - key: LOGIN_MAX_ATTEMPTS
        value: "20"
      - key: LOGIN_WINDOW
        value: PT1M
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
