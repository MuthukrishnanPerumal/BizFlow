# Build verification only. Deployments are handled by Vercel and Render GitHub integrations.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        env:
          # CI verifies the production bundle path; absolute URL is validated on Vercel.
          API_URL: https://example-api.onrender.com
        run: |
          npm ci
          npm run build
      - name: Verify production API URL and reject localhost
        shell: bash
        run: |
          if grep -RInE 'localhost:8080|127\.0\.0\.1:8080' dist/frontend/browser; then
            echo "Production bundle must not call localhost."
            exit 1
          fi
          if ! grep -RIF 'example-api.onrender.com' dist/frontend/browser >/dev/null; then
            echo "Expected API_URL was not embedded in the production bundle."
            exit 1
          fi

  backend:
    name: Backend package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package
        run: mvn -B -DskipTests package
      - name: Assert JAR exists
        run: test -f target/bizflow-server-0.1.0.jar

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aveline-bizflow-api:ci .
